<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3~4급 병음 복습 퀴즈</title>
<style>
:root {
  --bg: #fffaf6;
  --card: #ffffff;
  --text: #252525;
  --muted: #777;
  --line: #e8e1db;
  --accent: #dd6b5b;
  --accent-soft: #fff0ec;
  --ok: #2e7d32;
  --ok-soft: #edf7ee;
  --bad: #b33a3a;
  --bad-soft: #fff0f0;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
  "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
  background: var(--bg); color: var(--text);
}
.wrap {
  width: min(720px, 100%); margin: 0 auto; padding: 18px 16px 36px;
}
.header {
  text-align: center; padding: 18px 8px 12px;
}
.header h1 {
  margin: 0 0 8px; font-size: clamp(24px, 6vw, 34px);
}
.header p {
  margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6;
}
.brand {
  margin-top: 8px; font-size: 12px; color: #999;
}
.progress-row {
  display:flex; justify-content:space-between; align-items:center;
  margin: 14px 2px 8px; font-size:14px; color:var(--muted);
}
.progress {
  width:100%; height:9px; border-radius:999px; background:#eee7e1;
  overflow:hidden; margin-bottom:16px;
}
.progress > div {
  height:100%; width:0; background:var(--accent); transition:width .25s ease;
}
.card {
  background:var(--card); border:1px solid var(--line); border-radius:24px;
  padding:26px 22px; box-shadow:0 8px 24px rgba(80,60,40,.06);
}
.word {
  text-align:center; font-size: clamp(44px, 13vw, 70px); font-weight:700;
  margin: 8px 0 10px;
}
.prompt {
  text-align:center; color:var(--muted); margin-bottom:22px;
}
.options {
  display:grid; gap:12px;
}
.option {
  width:100%; min-height:58px; border:1px solid var(--line); border-radius:16px;
  background:white; font-size:22px; padding:14px 18px; cursor:pointer;
  text-align:left; transition:.15s ease; touch-action:manipulation;
}
.option:focus { outline:3px solid rgba(221,107,91,.20); }
.option:hover { border-color:#cfc4ba; }
.option.correct {
  background:var(--ok-soft); border-color:#8cc493; color:var(--ok);
}
.option.wrong {
  background:var(--bad-soft); border-color:#e0a1a1; color:var(--bad);
}
.option:disabled { cursor:default; opacity:1; }
.feedback {
  min-height:52px; margin:18px 0 4px; padding:12px 14px; border-radius:14px;
  font-size:15px; line-height:1.5; display:none;
}
.feedback.show { display:block; }
.feedback.ok { background:var(--ok-soft); color:var(--ok); }
.feedback.bad { background:var(--bad-soft); color:var(--bad); }
.actions {
  display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;
}
button.primary, button.secondary {
  min-height:48px; border-radius:14px; padding:0 18px; font-size:16px; cursor:pointer;
}
button.primary {
  border:0; background:var(--accent); color:white; flex:1;
}
button.secondary {
  border:1px solid var(--line); background:white; color:var(--text);
}
button:disabled { opacity:.45; cursor:not-allowed; }
.result {
  display:none; text-align:center;
}
.score {
  font-size:54px; font-weight:800; margin:12px 0 4px;
}
.result h2 { margin-top:0; }
.missed {
  text-align:left; margin-top:22px; border-top:1px solid var(--line); padding-top:18px;
}
.missed h3 { font-size:17px; }
.missed-list {
  display:grid; gap:8px;
}
.missed-item {
  display:flex; justify-content:space-between; gap:10px; padding:10px 12px;
  border-radius:12px; background:#faf7f4;
}
.footer {
  text-align:center; margin-top:18px; color:#999; font-size:12px;
}
@media (max-width: 420px) {
  .card { padding:22px 16px; border-radius:20px; }
  .option { font-size:20px; }
  .actions { flex-direction:column; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <h1>HSK 3~4급 병음 복습</h1>
    <p>각 단어의 올바른 병음을 골라 보세요.<br>정답을 선택하면 바로 확인할 수 있습니다.</p>
    <div class="brand">@book.yoonseul</div>
  </header>

  <div id="quizView">
    <div class="progress-row">
      <span id="progressText">1 / 36</span>
      <span id="scoreText">정답 0</span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>

    <section class="card" aria-live="polite">
      <div class="word" id="word"></div>
      <div class="prompt">올바른 병음은?</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="secondary" id="restartBtn" type="button">처음부터</button>
        <button class="primary" id="nextBtn" type="button" disabled>다음</button>
      </div>
    </section>
  </div>

  <section class="card result" id="resultView">
    <h2>복습 완료!</h2>
    <div class="score" id="finalScore"></div>
    <div id="finalMessage"></div>
    <div class="missed" id="missedSection">
      <h3>다시 보면 좋은 단어</h3>
      <div class="missed-list" id="missedList"></div>
    </div>
    <div class="actions">
      <button class="secondary" id="retryAllBtn" type="button">전체 다시 풀기</button>
      <button class="primary" id="retryWrongBtn" type="button">틀린 문제만 다시 풀기</button>
    </div>
  </section>

  <div class="footer">HSK 3~4급 병음 복습 · @book.yoonseul</div>
</div>

<script>
const ORIGINAL = [{"word": "存", "answer": "cún", "options": ["cǔn", "cún", "cùn"]}, {"word": "扔", "answer": "rēng", "options": ["réng", "rēng", "rěng"]}, {"word": "丢", "answer": "diū", "options": ["diū", "diú", "diǔ"]}, {"word": "脱", "answer": "tuō", "options": ["tuó", "tuǒ", "tuō"]}, {"word": "猜", "answer": "cāi", "options": ["cǎi", "cāi", "cái"]}, {"word": "寄", "answer": "jì", "options": ["jǐ", "jì", "jí"]}, {"word": "留", "answer": "liú", "options": ["liǔ", "liú", "liù"]}, {"word": "弄", "answer": "nòng", "options": ["nòng", "nóng", "nǒng"]}, {"word": "赶", "answer": "gǎn", "options": ["gàn", "gǎn", "gān"]}, {"word": "响", "answer": "xiǎng", "options": ["xiàng", "xiǎng", "xiāng"]}, {"word": "打印", "answer": "dǎyìn", "options": ["dǎyìn", "dàyìn", "dǎyǐn"]}, {"word": "反映", "answer": "fǎnyìng", "options": ["fǎnyíng", "fǎnyìng", "fànyìng"]}, {"word": "复印", "answer": "fùyìn", "options": ["fúyìn", "fùyìn", "fǔyìn"]}, {"word": "放弃", "answer": "fàngqì", "options": ["fāngqì", "fàngqǐ", "fàngqì"]}, {"word": "符合", "answer": "fúhé", "options": ["fùhé", "fúhé", "fúhè"]}, {"word": "估计", "answer": "gūjì", "options": ["gǔjì", "gūjì", "gūjǐ"]}, {"word": "鼓励", "answer": "gǔlì", "options": ["gǔlì", "gūlì", "gǔlí"]}, {"word": "后悔", "answer": "hòuhuǐ", "options": ["hòuhuǐ", "hòuhuì", "hǒuhuǐ"]}, {"word": "获得", "answer": "huòdé", "options": ["huòdé", "huǒdé", "huòdě"]}, {"word": "举办", "answer": "jǔbàn", "options": ["jùbàn", "jǔbàn", "jǔbǎn"]}, {"word": "拒绝", "answer": "jùjué", "options": ["jǔjué", "jùjuè", "jùjué"]}, {"word": "缺少", "answer": "quēshǎo", "options": ["quēshào", "quěshǎo", "quēshǎo"]}, {"word": "适合", "answer": "shìhé", "options": ["shíhé", "shìhé", "shìhè"]}, {"word": "熟悉", "answer": "shúxī", "options": ["shǔxī", "shúxī", "shúxí"]}, {"word": "提前", "answer": "tíqián", "options": ["tíqián", "tǐqián", "tíqiǎn"]}, {"word": "推迟", "answer": "tuīchí", "options": ["tuǐchí", "tuīchí", "tuīchǐ"]}, {"word": "填", "answer": "tián", "options": ["tiǎn", "tián", "tiān"]}, {"word": "误会", "answer": "wùhuì", "options": ["wǔhuì", "wùhuǐ", "wùhuì"]}, {"word": "引起", "answer": "yǐnqǐ", "options": ["yìnqǐ", "yǐnqǐ", "yǐnqì"]}, {"word": "允许", "answer": "yǔnxǔ", "options": ["yúnxǔ", "yǔnxǔ", "yǔnxù"]}, {"word": "值得", "answer": "zhídé", "options": ["zhǐdé", "zhídé", "zhídě"]}, {"word": "祝贺", "answer": "zhùhè", "options": ["zhǔhè", "zhùhé", "zhùhè"]}, {"word": "占线", "answer": "zhànxiàn", "options": ["zhǎnxiàn", "zhànxiàn", "zhànxiǎn"]}, {"word": "来得及", "answer": "lái de jí", "options": ["lǎi de jí", "lái de jí", "lái dé jǐ"]}, {"word": "来不及", "answer": "lái bù jí", "options": ["lái bǔ jí", "lái bù jí", "lǎi bù jí"]}, {"word": "继续", "answer": "jìxù", "options": ["jǐxù", "jìxù", "jìxǔ"]}];
let questions = [];
let index = 0;
let correctCount = 0;
let answered = false;
let missed = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(source = ORIGINAL) {
  questions = shuffle(source).map(q => ({...q, options: shuffle(q.options)}));
  index = 0;
  correctCount = 0;
  answered = false;
  missed = [];
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('quizView').style.display = 'block';
  render();
}

function render() {
  const q = questions[index];
  answered = false;
  document.getElementById('word').textContent = q.word;
  document.getElementById('progressText').textContent = `${index + 1} / ${questions.length}`;
  document.getElementById('scoreText').textContent = `정답 ${correctCount}`;
  document.getElementById('progressBar').style.width = `${(index / questions.length) * 100}%`;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = index === questions.length - 1 ? '결과 보기' : '다음';

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  feedback.textContent = '';

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => choose(btn, opt));
    box.appendChild(btn);
  });
}

function choose(button, selected) {
  if (answered) return;
  answered = true;
  const q = questions[index];
  const buttons = [...document.querySelectorAll('.option')];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  if (selected === q.answer) {
    correctCount++;
    fb.textContent = `정답입니다!  ${q.word} → ${q.answer}`;
    fb.className = 'feedback show ok';
  } else {
    button.classList.add('wrong');
    missed.push(q);
    fb.textContent = `아쉬워요. 정답은 “${q.answer}”입니다.`;
    fb.className = 'feedback show bad';
  }

  document.getElementById('scoreText').textContent = `정답 ${correctCount}`;
  document.getElementById('nextBtn').disabled = false;
}

function next() {
  if (!answered) return;
  if (index < questions.length - 1) {
    index++;
    render();
  } else {
    finish();
  }
}

function finish() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizView').style.display = 'none';
  const result = document.getElementById('resultView');
  result.style.display = 'block';

  const pct = Math.round((correctCount / questions.length) * 100);
  document.getElementById('finalScore').textContent = `${correctCount} / ${questions.length}`;
  let msg = '';
  if (pct === 100) msg = '완벽해요! 모든 병음을 정확하게 알고 있습니다.';
  else if (pct >= 80) msg = '아주 잘했어요. 틀린 단어만 한 번 더 확인해 보세요.';
  else if (pct >= 60) msg = '좋아요. 헷갈린 성조를 중심으로 다시 복습해 보세요.';
  else msg = '한 번 더 풀어 보면 훨씬 좋아질 거예요.';
  document.getElementById('finalMessage').textContent = msg;

  const missedSection = document.getElementById('missedSection');
  const missedList = document.getElementById('missedList');
  missedList.innerHTML = '';

  if (missed.length === 0) {
    missedSection.style.display = 'none';
    document.getElementById('retryWrongBtn').style.display = 'none';
  } else {
    missedSection.style.display = 'block';
    document.getElementById('retryWrongBtn').style.display = 'inline-block';
    missed.forEach(q => {
      const row = document.createElement('div');
      row.className = 'missed-item';
      const w = document.createElement('strong');
      w.textContent = q.word;
      const a = document.createElement('span');
      a.textContent = q.answer;
      row.appendChild(w); row.appendChild(a);
      missedList.appendChild(row);
    });
  }
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('restartBtn').addEventListener('click', () => startQuiz(ORIGINAL));
document.getElementById('retryAllBtn').addEventListener('click', () => startQuiz(ORIGINAL));
document.getElementById('retryWrongBtn').addEventListener('click', () => {
  const unique = [];
  const seen = new Set();
  missed.forEach(q => {
    if (!seen.has(q.word)) {
      seen.add(q.word);
      const original = ORIGINAL.find(x => x.word === q.word);
      if (original) unique.push(original);
    }
  });
  startQuiz(unique.length ? unique : ORIGINAL);
});

startQuiz();
</script>
</body>
</html>
