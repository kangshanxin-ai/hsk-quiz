<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3~4급 단어 복습 패키지</title>
<style>
:root {
 --bg:#fffaf6; --card:#fff; --text:#252525; --muted:#777; --line:#e8e1db;
 --accent:#d96c5d; --accentSoft:#fff0ec; --ok:#2f7d3a; --okSoft:#edf7ee;
 --bad:#b23b3b; --badSoft:#fff0f0; --chip:#f7f2ee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
.wrap{width:min(760px,100%);margin:0 auto;padding:18px 16px 38px}
header{text-align:center;padding:14px 8px 18px}
h1{font-size:clamp(25px,6vw,36px);margin:0 0 8px}
.sub{color:var(--muted);line-height:1.65;font-size:14px}
.brand{color:#999;font-size:12px;margin-top:8px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:18px;text-align:left;cursor:pointer;min-height:126px}
.mode:hover{border-color:#cfc3ba}
.mode strong{display:block;font-size:18px;margin-bottom:7px}
.mode span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.mode .count{margin-top:8px;color:var(--accent);font-weight:700}
.panel{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 2px 8px;color:var(--muted);font-size:14px}
.progress{height:9px;background:#eee7e1;border-radius:999px;overflow:hidden;margin-bottom:15px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 22px;box-shadow:0 8px 24px rgba(80,60,40,.06)}
.qtitle{font-size:14px;color:var(--accent);font-weight:700;margin-bottom:12px}
.prompt{font-size:clamp(20px,5vw,27px);font-weight:700;line-height:1.55;white-space:pre-line;margin-bottom:20px}
.options{display:grid;gap:11px}
.option{width:100%;min-height:56px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:18px;padding:13px 16px;text-align:left;cursor:pointer;line-height:1.45}
.option.correct{background:var(--okSoft);border-color:#91c497;color:var(--ok)}
.option.wrong{background:var(--badSoft);border-color:#e0a4a4;color:var(--bad)}
.option:disabled{opacity:1;cursor:default}
.feedback{display:none;margin-top:16px;padding:13px 14px;border-radius:14px;line-height:1.55;font-size:14px;white-space:pre-line}
.feedback.show{display:block}
.feedback.ok{background:var(--okSoft);color:var(--ok)}
.feedback.bad{background:var(--badSoft);color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.primary,button.secondary{min-height:48px;border-radius:14px;padding:0 17px;font-size:15px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border:0;flex:1}
button.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;text-align:center}
.score{font-size:52px;font-weight:800;margin:10px 0 5px}
.missed{text-align:left;border-top:1px solid var(--line);margin-top:20px;padding-top:17px}
.missed-list{display:grid;gap:8px;max-height:340px;overflow:auto}
.missed-item{background:#faf7f4;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.home-note{margin-top:14px;color:#888;font-size:13px;text-align:center}
.footer{text-align:center;color:#999;font-size:12px;margin-top:18px}
@media(max-width:480px){
 .menu{grid-template-columns:1fr}
 .card{padding:21px 16px}
 .actions{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>HSK 3~4급 단어 복습</h1>
  <div class="sub">오늘은 어떤 방식으로 복습할까요?<br>정답을 고르면 바로 확인할 수 있고, 마지막에는 틀린 문제만 다시 풀 수 있습니다.</div>
  <div class="brand">@book.yoonseul</div>
</header>

<section id="home">
  <div class="menu">
    <button class="mode" data-mode="meaning"><strong>① 단어 뜻 퀴즈</strong><span>중국어 단어 → 핵심 한국어 뜻</span><span class="count">36문제</span></button>
    <button class="mode" data-mode="collocation"><strong>② 搭配 고르기</strong><span>문장에서 자연스럽게 결합하는 단어 고르기</span><span class="count">36문제</span></button>
    <button class="mode" data-mode="synonym"><strong>③ 유의어 구별</strong><span>扔/丢, 打印/复印, 符合/适合 등 비교</span><span class="count">24문제</span></button>
    <button class="mode" data-mode="cloze"><strong>④ HSK 문장 빈칸</strong><span>HSK3~4급 수준 문맥에서 정답 고르기</span><span class="count">36문제</span></button>
  </div>
  <div class="home-note">문제 순서와 보기 순서는 다시 시작할 때마다 바뀝니다.</div>
</section>

<section class="panel" id="quizPanel">
  <div class="topbar"><span id="progressText"></span><span id="scoreText"></span></div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="card">
    <div class="qtitle" id="modeTitle"></div>
    <div class="prompt" id="prompt"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="secondary" id="homeBtn" type="button">메뉴로</button>
      <button class="secondary" id="restartBtn" type="button">처음부터</button>
      <button class="primary" id="nextBtn" type="button" disabled>다음</button>
    </div>
  </div>
</section>

<section class="card result" id="resultPanel">
  <div class="qtitle" id="resultTitle"></div>
  <h2>복습 완료!</h2>
  <div class="score" id="finalScore"></div>
  <div id="finalMessage"></div>
  <div class="missed" id="missedSection">
    <h3>다시 확인할 문제</h3>
    <div class="missed-list" id="missedList"></div>
  </div>
  <div class="actions">
    <button class="secondary" id="resultHomeBtn" type="button">다른 퀴즈 선택</button>
    <button class="secondary" id="retryAllBtn" type="button">전체 다시 풀기</button>
    <button class="primary" id="retryWrongBtn" type="button">틀린 문제만 다시 풀기</button>
  </div>
</section>

<div class="footer">HSK 3~4급 단어 복습 · @book.yoonseul</div>
</div>

<script>
const MODES = {"meaning": {"title": "단어 뜻 퀴즈", "subtitle": "중국어 단어의 핵심 뜻을 고르세요.", "items": [{"prompt": "‘存’의 뜻으로 가장 알맞은 것은?", "answer": "저장하다·맡기다·저축하다", "options": ["저장하다·맡기다·저축하다", "포기하다", "복사하다"], "explanation": "存 cún → 저장하다·맡기다·저축하다"}, {"prompt": "‘扔’의 뜻으로 가장 알맞은 것은?", "answer": "던지다·버리다", "options": ["던지다·버리다", "잃어버리다", "우편·택배로 보내다"], "explanation": "扔 rēng → 던지다·버리다"}, {"prompt": "‘丢’의 뜻으로 가장 알맞은 것은?", "answer": "잃어버리다", "options": ["잃어버리다", "던지다·버리다", "남다·남기다"], "explanation": "丢 diū → 잃어버리다"}, {"prompt": "‘脱’의 뜻으로 가장 알맞은 것은?", "answer": "벗다", "options": ["벗다", "기입하다·채우다", "저장하다·맡기다·저축하다"], "explanation": "脱 tuō → 벗다"}, {"prompt": "‘猜’의 뜻으로 가장 알맞은 것은?", "answer": "추측하다·맞혀 보다", "options": ["추측하다·맞혀 보다", "추산하다·예상하다", "익숙하다·잘 알다"], "explanation": "猜 cāi → 추측하다·맞혀 보다"}, {"prompt": "‘寄’의 뜻으로 가장 알맞은 것은?", "answer": "우편·택배로 보내다", "options": ["우편·택배로 보내다", "행사·활동을 개최하다", "남다·남기다"], "explanation": "寄 jì → 우편·택배로 보내다"}, {"prompt": "‘留’의 뜻으로 가장 알맞은 것은?", "answer": "남다·남기다", "options": ["남다·남기다", "잃어버리다", "미루다·연기하다"], "explanation": "留 liú → 남다·남기다"}, {"prompt": "‘弄’의 뜻으로 가장 알맞은 것은?", "answer": "다루다·어떤 상태가 되게 하다", "options": ["다루다·어떤 상태가 되게 하다", "인쇄하다", "얻다·획득하다"], "explanation": "弄 nòng → 다루다·어떤 상태가 되게 하다"}, {"prompt": "‘赶’의 뜻으로 가장 알맞은 것은?", "answer": "서두르다·시간에 맞춰 따라잡다", "options": ["서두르다·시간에 맞춰 따라잡다", "계속하다", "적합하다·잘 맞다"], "explanation": "赶 gǎn → 서두르다·시간에 맞춰 따라잡다"}, {"prompt": "‘响’의 뜻으로 가장 알맞은 것은?", "answer": "울리다·소리가 나다", "options": ["울리다·소리가 나다", "반영하다·상황을 알리다", "통화 중이다"], "explanation": "响 xiǎng → 울리다·소리가 나다"}, {"prompt": "‘打印’의 뜻으로 가장 알맞은 것은?", "answer": "인쇄하다", "options": ["인쇄하다", "복사하다", "기입하다·채우다"], "explanation": "打印 dǎyìn → 인쇄하다"}, {"prompt": "‘反映’의 뜻으로 가장 알맞은 것은?", "answer": "반영하다·상황을 알리다", "options": ["반영하다·상황을 알리다", "일으키다·야기하다", "격려하다"], "explanation": "反映 fǎnyìng → 반영하다·상황을 알리다"}, {"prompt": "‘复印’의 뜻으로 가장 알맞은 것은?", "answer": "복사하다", "options": ["복사하다", "인쇄하다", "우편·택배로 보내다"], "explanation": "复印 fùyìn → 복사하다"}, {"prompt": "‘放弃’의 뜻으로 가장 알맞은 것은?", "answer": "포  "举办", "缺少"], "explanation": "상을 얻거나 획득하는 것은 ‘获得’입니다."}, {"prompt": "学校准备下个月___一次国际文化节。", "answer": "举办", "options": ["举办", "获得", "继续"], "explanation": "행사나 활동을 열 때 ‘举办’을 씁니다."}, {"prompt": "因为那天有别的安排，他只好___了我们的邀请。", "answer": "拒绝", "options": ["拒绝", "允许", "鼓励"], "explanation": "초대를 받아들이지 않는 것은 ‘拒绝邀请’입니다."}, {"prompt": "这篇文章内容不错，不过___一些具体的例子。", "answer": "缺少", "options": ["缺少", "获得", "符合"], "explanation": "필요한 예가 충분하지 않다는 뜻이므로 ‘缺少’입니다."}, {"prompt": "这双鞋太大了，不太___你。", "answer": "适合", "options": ["适合", "符合", "熟悉"], "explanation": "사람에게 크기·스타일 등이 잘 맞는다는 뜻은 ‘适合’입니다."}, {"prompt": "我在这儿住了三年，对附近已经很___了。", "answer": "熟悉", "options": ["熟悉", "适合", "符合"], "explanation": "장소를 잘 알고 익숙한 상태는 ‘熟悉’입니다."}, {"prompt": "明天可能堵车，我们___半个小时出发吧。", "answer": "提前", "options": ["提前", "推迟", "继续"], "explanation": "예정보다 먼저 출발하는 것은 ‘提前’입니다."}, {"prompt": "经理临时有事，会议只好___到下午三点。", "answer": "推迟", "options": ["推迟", "提前", "继续"], "explanation": "시간을 뒤로 미루는 것은 ‘推迟到…’입니다."}, {"prompt": "请先___好申请表，再交给工作人员。", "answer": "填", "options": ["填", "打印", "寄"], "explanation": "양식의 정보를 기입하는 것은 ‘填表/填好申请表’입니다."}, {"prompt": "你___了，我不是不想帮你，只是今天真的没时间。", "answer": "误会", "options": ["误会", "后悔", "估计"], "explanation": "상대방이 자신의 의도를 잘못 이해했음을 바로잡는 문맥입니다."}, {"prompt": "他的发言___了大家对环境问题的关注。", "answer": "引起", "options": ["引起", "反映", "获得"], "explanation": "관심·주의·토론 등을 일으키는 것은 ‘引起’입니다."}, {"prompt": "图书馆里不___大声说话。", "answer": "允许", "options": ["允许", "拒绝", "适合"], "explanation": "규정상 행동을 허락하지 않는다는 의미는 ‘不允许’입니다."}, {"prompt": "这部电影虽然很长，但是非常___看。", "answer": "值得", "options": ["值得", "符合", "来得及"], "explanation": "‘值得＋동사’는 그 행동을 할 가치가 있다는 뜻입니다."}, {"prompt": "听说你考上了大学，真___你！", "answer": "祝贺", "options": ["祝贺", "鼓励", "举办"], "explanation": "좋은 결과를 얻은 사람에게 축하하는 표현입니다."}, {"prompt": "我给客服打了三次电话，可是每次都___。", "answer": "占线", "options": ["占线", "响", "来不及"], "explanation": "전화를 걸었지만 상대 회선이 통화 중인 상황입니다."}, {"prompt": "电影八点开始，现在才七点，我们还___吃个饭。", "answer": "来得及", "options": ["来得及", "来不及", "赶不上"], "explanation": "영화 전 식사를 할 시간이 충분하므로 ‘来得及’입니다."}, {"prompt": "快走吧，再晚十分钟就___坐最后一班车了。", "answer": "来不及", "options": ["来不及", "来得及", "提前"], "explanation": "곧 시간이 부족해질 상황이므로 ‘来不及＋동사’입니다."}, {"prompt": "老师回答完问题以后，又___讲下一课。", "answer": "继续", "options": ["继续", "放弃", "推迟"], "explanation": "중단 후 수업을 이어 가는 것은 ‘继续’입니다."}]}};
let modeKey = null, questions = [], index = 0, correct = 0, answered = false, missed = [];

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}
  return x;
}

function goHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('quizPanel').style.display='none';
  document.getElementById('resultPanel').style.display='none';
}

function startMode(key, source=null){
  modeKey=key;
  const base=source || MODES[key].items;
  questions=shuffle(base).map(q=>({...q, options:shuffle(q.options)}));
  index=0; correct=0; answered=false; missed=[];
  document.getElementById('home').style.display='none';
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('quizPanel').style.display='block';
  render();
}

function render(){
  const q=questions[index]; answered=false;
  document.getElementById('modeTitle').textContent=MODES[modeKey].title;
  document.getElementById('prompt').textContent=q.prompt;
  document.getElementById('progressText').textContent=`${index+1} / ${questions.length}`;
  document.getElementById('scoreText').textContent=`정답 ${correct}`;
  document.getElementById('progressBar').style.width=`${index/questions.length*100}%`;
  const next=document.getElementById('nextBtn');
  next.disabled=true; next.textContent=index===questions.length-1?'결과 보기':'다음';
  const fb=document.getElementById('feedback'); fb.className='feedback'; fb.textContent='';
  const box=document.getElementById('options'); box.innerHTML='';
  q.options.forEach(opt=>{
    const b=document.createElement('button'); b.type='button'; b.className='option'; b.textContent=opt;
    b.addEventListener('click',()=>choose(b,opt)); box.appendChild(b);
  });
}

function choose(btn,selected){
  if(answered)return; answered=true;
  const q=questions[index];
  document.querySelectorAll('.option').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.answer)b.classList.add('correct');
  });
  const fb=document.getElementById('feedback');
  if(selected===q.answer){
    correct++; fb.textContent=`정답입니다!\n${q.explanation}`; fb.className='feedback show ok';
  }else{
    btn.classList.add('wrong'); missed.push(q);
    fb.textContent=`정답은 “${q.answer}”입니다.\n${q.explanation}`; fb.className='feedback show bad';
  }
  document.getElementById('scoreText').textContent=`정답 ${correct}`;
  document.getElementById('nextBtn').disabled=false;
}

function next(){
  if(!answered)return;
  if(index<questions.length-1){index++;render()} else finish();
}

function finish(){
  document.getElementById('quizPanel').style.display='none';
  document.getElementById('resultPanel').style.display='block';
  document.getElementById('resultTitle').textContent=MODES[modeKey].title;
  document.getElementById('finalScore').textContent=`${correct} / ${questions.length}`;
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('finalMessage').textContent=
    pct===100?'완벽해요! 모든 문제를 정확하게 풀었습니다.':
    pct>=80?'아주 잘했어요. 틀린 문제만 한 번 더 보면 좋습니다.':
    pct>=60?'좋아요. 헷갈린 결합과 단어 차이를 다시 확인해 보세요.':
    '한 번 더 풀어 보면 단어가 훨씬 선명해질 거예요.';
  const sec=document.getElementById('missedSection'), list=document.getElementById('missedList'), rw=document.getElementById('retryWrongBtn');
  list.innerHTML='';
  if(!missed.length){sec.style.display='none';rw.style.display='none'}
  else{
    sec.style.display='block';rw.style.display='inline-block';
    missed.forEach(q=>{
      const d=document.createElement('div');d.className='missed-item';
      d.textContent=`${q.prompt.replace(/\n/g,' ')} → ${q.answer}`;
      list.appendChild(d);
    });
  }
}

document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>startMode(b.dataset.mode)));
document.getElementById('homeBtn').addEventListener('click',goHome);
document.getElementById('restartBtn').addEventListener('click',()=>startMode(modeKey));
document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('resultHomeBtn').addEventListener('click',goHome);
document.getElementById('retryAllBtn').addEventListener('click',()=>startMode(modeKey));
document.getElementById('retryWrongBtn').addEventListener('click',()=>startMode(modeKey, missed));
</script>
</body>
</html>
